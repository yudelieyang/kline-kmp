*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,'Noto Sans CJK SC','Noto Sans SC',sans-serif;background:#D5DAE1;padding:24px;color:#111827}
h1{font-size:20px;margin-bottom:4px} .lede{font-size:13px;color:#4B5563;margin-bottom:20px;max-width:1200px;line-height:1.5}
.wall{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.frame{display:flex;flex-direction:column;gap:8px}
figcaption{font-size:12px;line-height:1.45;color:#374151;max-width:430px}

.content{display:flex;flex-direction:column;overflow:hidden}
.navbar{height:16px;display:flex;justify-content:center;align-items:center}.pill{width:108px;height:4px;border-radius:2px;opacity:.6}
.topbar{height:calc(56px + (var(--fs) - 1)*24px);display:flex;align-items:center;padding:0 0 0 12px;gap:0;flex-shrink:0}
.title{flex:1;min-width:0}.sym{font-size:calc(var(--fs)*18px);font-weight:600;line-height:1.2}
.sub{font-size:calc(var(--fs)*12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chiptouch{min-width:48px;height:48px;display:flex;align-items:center;justify-content:center;padding:0 2px}
.chip{position:relative;height:28px;border-radius:14px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:calc(var(--fs)*12px);font-weight:500;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;flex-shrink:0}
.pulse{box-shadow:0 0 0 3px rgba(79,70,229,.18)}

.badge{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:3px}
.iconbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pblock{display:flex;gap:16px;padding:4px 12px 4px;flex-shrink:0;align-items:flex-start}
.pl{flex:1;min-width:0}
.price{font-size:calc(var(--fs)*30px);font-weight:700;line-height:1.15;letter-spacing:-.3px}
.chg{font-size:calc(var(--fs)*14px);font-weight:500;margin-top:2px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cl{font-size:calc(var(--fs)*11px);font-weight:400}
.cap{font-size:calc(var(--fs)*11px);margin-top:2px}
.grid{display:grid;grid-template-columns:auto auto;column-gap:16px;row-gap:6px;padding-top:4px}
.stat .sl,.sl{font-size:calc(var(--fs)*11px)} .sv{font-size:calc(var(--fs)*13px);font-weight:500}
.pblock.compact{flex-direction:column;gap:8px}
.pblock.compact .grid{grid-template-columns:1fr 1fr;width:100%}
.foot{font-size:calc(var(--fs)*11px);padding:2px 12px 0;flex-shrink:0;line-height:1.35}
.marow{min-height:24px;display:flex;flex-wrap:wrap;column-gap:12px;align-items:center;padding:2px 12px;font-size:calc(var(--fs)*12px);flex-shrink:0}
.banner{margin:4px 12px;min-height:40px;border:1px solid;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;font-size:calc(var(--fs)*13px);line-height:1.35;flex-shrink:0}
.btxt{flex:1;padding:6px 0}
.bact{min-height:48px;display:flex;align-items:center;padding:0 10px;font-weight:600;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.chart{flex-shrink:0;line-height:0}
.hr{height:1px;flex-shrink:0}
.list{flex:1;min-height:0;overflow:hidden}
.lhead,.lrow{display:flex;align-items:center;padding:0 12px;border-bottom:.5px solid}
.lhead{height:28px;font-size:calc(var(--fs)*11px);white-space:nowrap}
.lrow{height:36px;font-size:calc(var(--fs)*13px)}
.c1{flex:1.1}.c2{flex:1.2;text-align:right}.c3{flex:1;text-align:right}.c4{flex:.9;text-align:right}
.lempty{padding:16px 12px;font-size:calc(var(--fs)*13px)}
.scrim{position:absolute;inset:0}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;padding:8px 16px 28px;max-height:78%;overflow:hidden}
.handle{width:32px;height:4px;border-radius:2px;margin:0 auto 12px}
.stitle{font-size:16px;font-weight:600;margin-bottom:8px}
.srow{display:flex;gap:12px;padding:7px 0;align-items:flex-start;font-size:13px;line-height:1.4}
.sk{width:72px;flex-shrink:0}.sv2{flex:1;min-width:0;word-break:break-all}
.srow .chiptouch{height:auto;justify-content:flex-start;padding:0}
.ssec{font-size:12px;margin:10px 0 6px}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.sfoot{font-size:11px;margin-top:14px}
